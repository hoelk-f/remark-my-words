name: Publish release
run-name: Publish release ${{ inputs.version || github.ref_name }}

on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Release tag must be an exact x.y.z version without a v prefix.'
          }
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.version || github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:release
      - run: npm run test:browser
      - run: npm run test:build
      - run: npm run package:release
      - run: npm run check:build
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/remark-my-words/main.js
            dist/remark-my-words/manifest.json
            dist/remark-my-words/styles.css
      - name: Publish verified installable assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The maintainer's local release command creates the draft. Never
          # create a bot-owned release when that step is delayed or fails.
          found=false
          for attempt in {1..12}; do
            if gh release view "$RELEASE_TAG" --json author,isDraft > release-state.json; then
              found=true
              break
            fi
            sleep 5
          done
          if [ "$found" != true ]; then
            echo "Missing release draft. Run npm run release -- $RELEASE_TAG --resume as hoelk-f, then rerun this workflow."
            exit 1
          fi
          if jq -e '.isDraft == false' release-state.json > /dev/null; then
            echo "Release is already public; published assets will not be overwritten."
            exit 0
          fi
          jq -e '.author.login == "hoelk-f"' release-state.json > /dev/null || {
            echo "Only a draft created by hoelk-f may be published."
            exit 1
          }
          gh release upload "$RELEASE_TAG" \
            dist/remark-my-words/main.js \
            dist/remark-my-words/manifest.json \
            dist/remark-my-words/styles.css --clobber
          gh release view "$RELEASE_TAG" --json assets | jq -e '
            [.assets[] | select(.state == "uploaded" and .size > 0) | .name] as $names |
            ["main.js", "manifest.json", "styles.css"] | all(. as $name | $names | index($name) != null)'
          gh release edit "$RELEASE_TAG" --draft=false --latest
